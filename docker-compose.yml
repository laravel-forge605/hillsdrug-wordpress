services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    command: --max_allowed_packet=256M
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:php8.2-apache
    restart: unless-stopped
    depends_on: [db]
    ports:
      - "${WP_PORT}:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_TABLE_PREFIX: ${TABLE_PREFIX}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', 'http://localhost:${WP_PORT}');
        define('WP_SITEURL', 'http://localhost:${WP_PORT}');
        define('FORCE_SSL_ADMIN', false);
    volumes:
      - .:/var/www/html
      # local .htaccess without the HTTPS redirect
      - ./docker/htaccess.local:/var/www/html/.htaccess
      # disable the forced-HTTPS plugin on localhost
      - ./docker/disable-https.php:/var/www/html/wp-content/mu-plugins/zz-local-dev.php
      - ./docker/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini

  phpmyadmin:
    image: phpmyadmin:latest
    restart: unless-stopped
    depends_on: [db]
    ports:
      - "${PMA_PORT}:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: ${DB_ROOT_PASSWORD}
      UPLOAD_LIMIT: 1G
      MEMORY_LIMIT: 1G
      MAX_EXECUTION_TIME: 0

volumes:
  db_data:
